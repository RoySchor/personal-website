<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link
      rel="shortcut icon"
      sizes="114x114"
      type="image/x-icon"
      href="./assets/Headshot-favicon.jpg"
    />
    <title>Roy Schor</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #666666;
        overflow: hidden;
      }
      #c,
      #loader {
        display: block;
      }
      #c {
        position: fixed;
        top: 0;
        left: 0;
        inset: 0;
        z-index: 1;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        transition: opacity 400ms ease;
      }
      #loader.hide {
        opacity: 0;
        pointer-events: none;
      }

      #instructions-overlay {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 15px;
        border-radius: 8px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        font-size: 20px;
        line-height: 1.4;
        pointer-events: none;
        transition: opacity 0.5s ease;
        z-index: 10;
        max-width: 300px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }

      #instructions-overlay.hidden {
        opacity: 0;
      }

      .mobile-text {
        display: none;
      }
      .desktop-text {
        display: inline;
      }

      @media (max-width: 1024px), (hover: none) {
        #instructions-overlay {
          right: 10px;
          bottom: 10px;
          font-size: 12px;
        }
        .mobile-text {
          display: inline;
        }
        .desktop-text {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- matrix loader overlay -->
    <canvas id="loader"></canvas>

    <!-- Instructions Overlay -->
    <div id="instructions-overlay">
      <span class="desktop-text"
        >Move and zoom with mouse. Click around on laptop, speaker, etc to explore!</span
      >
      <span class="mobile-text"
        >Drag and pinch to move and zoom. Click around on laptop, speaker, etc to explore!</span
      >
    </div>

    <!-- three.js canvas -->
    <canvas id="c"></canvas>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
